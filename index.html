<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSOC - Say Something On Chain</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel dla JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Ethers.js v5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ADRESY TWOICH NOWYCH KONTRAKTÓW SSOC
        const SSOC_BOARD_ADDRESS = "0x27174F7303D818EDDFFDEFB3d1007EaE61C3a2a6"; 
        const SSOC_TOKEN_ADDRESS = "0x6472093554b518E6627C1f4E101031aA66C8C009"; 
        const BASE_SEPOLIA_RPC = "https://sepolia.base.org";

        // ABI NOWYCH KONTRAKTÓW SSOC
        const SSOC_BOARD_ABI = [
            "function postMessage(string calldata tag, string calldata content) external",
            "function buyTokens(uint256 amountOfTokens) external payable",
            "function dailyMessageCount(address user, uint256 day) external view returns (uint256)",
            "function dailyFreeLimit() external view returns (uint256)",
            "function voteComment(uint256 _commentId) external",
            "function setNickname(string memory _nickname) external payable",
            "function registerCustomTag(string memory _tagName) external",
            "function buyOrSnipeTag(string memory _tagName) external payable",
            "function commentsCount() external view returns (uint256)",
            "function comments(uint256) external view returns (uint256 id, address author, string memory content, string memory tag, uint256 votes, uint256 timestamp)",
            "function nicknames(address) external view returns (string memory)",
            "function nicknameChangesCount(address) external view returns (uint256)",
            "function tags(string) external view returns (string memory name, address owner, uint256 usesCount, uint256 currentPrice, bool isOwned)",
            "function topCommentPerDay(uint256) external view returns (uint256)"
        ];

        const SSOC_TOKEN_ABI = [
            "function balanceOf(address account) external view returns (uint256)",
            "function allowance(address owner, address spender) external view returns (uint256)",
            "function approve(address spender, uint256 amount) external returns (bool)"
        ];

        const translations = {
            en: {
                brand: "SSOC",
                tagline: "Say Something On Chain",
                connectWallet: "Connect Wallet",
                setNickname: "Nickname",
                nicknamePlaceholder: "Set nickname...",
                saveNickname: "Save",
                registerTagTitle: "Register Tag",
                tagRegPlaceholder: "New tag...",
                registerTagBtn: "Register",
                feedTitle: "Community Discussions (On-Chain)",
                postPlaceholder: "Write something permanently on chain...",
                tagPlaceholder: "Tag (leave empty for DEFAULT)",
                publish: "Publish Post",
                searchPlaceholder: "🔍 Search or inspect tag...",
                clearFilter: "Clear",
                rulesBtn: "Rules & Mechanics",
                rulesTitle: "SSOC Comprehensive Mechanics Guide",
                rulesIntro: "SSOC (Say Something On Chain) is a fully decentralized Web3 discussion platform operating on the Base L2 network.",
                freeMsgLabel: "Daily Free Messages:",
                tokenBalanceLabel: "Your $SSOC Balance:",
                buyTokensBtn: "Buy $SSOC Tokens",
                buyAmountPlaceholder: "Amount of tokens...",
                buyModalTitle: "Purchase $SSOC Tokens",
                buyModalDesc: "Need more messages beyond your daily free 150 limit? Buy $SSOC tokens directly using ETH (0.00001 ETH / token).",
                buyAction: "Buy with ETH",
                close: "Close"
            },
            pl: {
                brand: "SSOC",
                tagline: "Say Something On Chain (Napisz coś on-chain)",
                connectWallet: "Połącz Portfel",
                setNickname: "Twój Nick",
                nicknamePlaceholder: "Wpisz nick...",
                saveNickname: "Zapisz",
                registerTagTitle: "Rejestracja Tagu",
                tagRegPlaceholder: "Wpisz tag...",
                registerTagBtn: "Rejestruj",
                feedTitle: "Dyskusje Społeczności (On-Chain)",
                postPlaceholder: "Napisz coś na stałe w blockchainie...",
                tagPlaceholder: "Tag (zostaw puste dla DEFAULT)",
                publish: "Opublikuj wpis",
                searchPlaceholder: "🔍 Szukaj lub sprawdź tag...",
                clearFilter: "Wyczyść",
                rulesBtn: "Zasady i Mechanika",
                rulesTitle: "Kompleksowe Zasady Działania SSOC",
                rulesIntro: "SSOC (Say Something On Chain) to w pełni zdecentralizowana platforma społecznościowa Web3 działająca w sieci Base L2.",
                freeMsgLabel: "Darmowe wiadomości dzisiaj:",
                tokenBalanceLabel: "Twoje saldo $SSOC:",
                buyTokensBtn: "Kup Tokeny $SSOC",
                buyAmountPlaceholder: "Ilość tokenów...",
                buyModalTitle: "Kup Tokeny $SSOC",
                buyModalDesc: "Potrzebujesz więcej wiadomości po wyczerpaniu darmowego limitu 150/dobę? Dokup tokeny $SSOC za ETH (0.00001 ETH / token).",
                buyAction: "Kup za ETH",
                close: "Zamknij"
            }
        };

        function App() {
            const [lang, setLang] = useState('pl');
            const [wallet, setWallet] = useState(null);
            const [nickname, setNickname] = useState('');
            const [newTagInput, setNewTagInput] = useState('');
            const [postText, setPostText] = useState('');
            const [postTag, setPostTag] = useState('');
            const [searchFilter, setSearchFilter] = useState('');
            const [showRules, setShowRules] = useState(false);
            const [showBuyModal, setShowBuyModal] = useState(false);
            const [buyAmount, setBuyAmount] = useState('10');
            const [toast, setToast] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [posts, setPosts] = useState([]);
            
            // Nowe stany dla Tokenomiki SSOC
            const [usedMessagesToday, setUsedMessagesToday] = useState(0);
            const [dailyLimit, setDailyLimit] = useState(150);
            const [ssocBalance, setSsocBalance] = useState("0");

            const t = translations[lang] || translations.pl;

            const showNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const loadUserData = async (userAddr) => {
                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const board = new ethers.Contract(SSOC_BOARD_ADDRESS, SSOC_BOARD_ABI, provider);
                    const token = new ethers.Contract(SSOC_TOKEN_ADDRESS, SSOC_TOKEN_ABI, provider);

                    const currentDay = Math.floor(Date.now() / 1000 / 86400);
                    const used = await board.dailyMessageCount(userAddr, currentDay);
                    const limit = await board.dailyFreeLimit();
                    const bal = await token.balanceOf(userAddr);

                    setUsedMessagesToday(used.toNumber());
                    setDailyLimit(limit.toNumber());
                    setSsocBalance(ethers.utils.formatUnits(bal, 18));
                } catch (err) {
                    console.error("Error loading user data:", err);
                }
            };

            const loadPostsFromBlockchain = async () => {
                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const contract = new ethers.Contract(SSOC_BOARD_ADDRESS, SSOC_BOARD_ABI, provider);
                    
                    const count = await contract.commentsCount();
                    const loadedPosts = [];

                    for (let i = 1; i <= count.toNumber(); i++) {
                        const c = await contract.comments(i);
                        let authorNick = "";
                        try {
                            authorNick = await contract.nicknames(c.author);
                        } catch (e) {}

                        loadedPosts.push({
                            id: c.id.toNumber(),
                            author: c.author.slice(0,6) + '...' + c.author.slice(-4),
                            fullAuthor: c.author,
                            name: authorNick || 'Anonim',
                            text: c.content,
                            tag: c.tag || 'DEFAULT',
                            votes: c.votes.toNumber()
                        });
                    }

                    setPosts(loadedPosts.reverse());
                } catch (err) {
                    console.error("Error loading posts:", err);
                }
            };

            useEffect(() => {
                loadPostsFromBlockchain();
            }, []);

            const connectWallet = async () => {
                if (window.ethereum) {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        setWallet(accounts[0]);
                        showNotification("Portfel połączony!");
                        await loadUserData(accounts[0]);
                    } catch (err) {
                        showNotification("Błąd połączenia z portfelem", "error");
                    }
                } else {
                    alert("Zainstaluj MetaMask!");
                }
            };

            const handlePublish = async (e) => {
                e.preventDefault();
                if (!postText.trim()) {
                    showNotification("Treść wiadomości nie może być pusta", "error");
                    return;
                }
                if (!window.ethereum || !wallet) {
                    showNotification("Najpierw połącz portfel!", "error");
                    connectWallet();
                    return;
                }

                const tagToSend = postTag.trim() ? postTag.trim().replace('#', '') : "DEFAULT";

                try {
                    setIsProcessing(true);
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const board = new ethers.Contract(SSOC_BOARD_ADDRESS, SSOC_BOARD_ABI, signer);
                    const token = new ethers.Contract(SSOC_TOKEN_ADDRESS, SSOC_TOKEN_ABI, signer);

                    // Sprawdzenie czy wyczerpano darmowy limit
                    if (usedMessagesToday >= dailyLimit) {
                        showNotification("Darmowy limit wyczerpany. Sprawdzanie zgody na tokeny $SSOC...", "info");
                        const allowance = await token.allowance(wallet, SSOC_BOARD_ADDRESS);
                        if (allowance.lt(ethers.utils.parseUnits("1", 18))) {
                            showNotification("Zatwierdzanie tokenów w MetaMask (Approve)...", "info");
                            const appTx = await token.approve(SSOC_BOARD_ADDRESS, ethers.constants.MaxUint256);
                            await appTx.wait();
                        }
                    }

                    showNotification("Publikowanie wiadomości on-chain...", "info");
                    const tx = await board.postMessage(tagToSend, postText, { gasLimit: 300000 });
                    await tx.wait();

                    setPostText('');
                    showNotification("Wiadomość została opublikowana!", "success");
                    loadPostsFromBlockchain();
                    loadUserData(wallet);
                } catch (err) {
                    console.error(err);
                    showNotification("Błąd podczas wysyłania wpisu", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleBuyTokens = async () => {
                if (!buyAmount || parseInt(buyAmount) <= 0) return;
                if (!window.ethereum || !wallet) {
                    connectWallet();
                    return;
                }

                try {
                    setIsProcessing(true);
                    showNotification("Transakcja zakupu w toku...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const board = new ethers.Contract(SSOC_BOARD_ADDRESS, SSOC_BOARD_ABI, signer);

                    const pricePerToken = ethers.utils.parseEther("0.00001");
                    const totalCost = pricePerToken.mul(buyAmount);

                    const tx = await board.buyTokens(buyAmount, { value: totalCost });
                    await tx.wait();

                    showNotification(`Zakupiono ${buyAmount} tokenów $SSOC!`, "success");
                    setShowBuyModal(false);
                    loadUserData(wallet);
                } catch (err) {
                    console.error(err);
                    showNotification("Zakup nie powiódł się", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div class="max-w-4xl mx-auto px-4 py-6 space-y-6">
                    <!-- PASEK GÓRNY / HEADER -->
                    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <div>
                            <h1 class="text-2xl font-black text-indigo-400 tracking-wider">{t.brand}</h1>
                            <p class="text-xs text-slate-400">{t.tagline}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onClick={() => setLang(lang === 'pl' ? 'en' : 'pl')} class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold border border-slate-700">
                                🌐 {lang.toUpperCase()}
                            </button>
                            <button onClick={connectWallet} class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
                                {wallet ? `${wallet.slice(0,6)}...${wallet.slice(-4)}` : t.connectWallet}
                            </button>
                        </div>
                    </header>

                    <!-- PANEL TOKENOMIKI I LIMITÓW (Gdy portfel połączony) -->
                    {wallet && (
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-900/80 p-4 rounded-xl border border-indigo-900/40">
                            <div class="text-center">
                                <p class="text-xs text-slate-400">{t.freeMsgLabel}</p>
                                <p class="text-xl font-bold text-green-400">{usedMessagesToday} / {dailyLimit}</p>
                            </div>
                            <div class="text-center">
                                <p class="text-xs text-slate-400">{t.tokenBalanceLabel}</p>
                                <p class="text-xl font-bold text-indigo-400">{parseFloat(ssocBalance).toFixed(2)} $SSOC</p>
                            </div>
                            <div class="flex items-center justify-center">
                                <button onClick={() => setShowBuyModal(true)} class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-3 rounded-lg transition">
                                    + {t.buyTokensBtn}
                                </button>
                            </div>
                        </div>
                    )}

                    <!-- FORMULARZ NOWEGO WPISU -->
                    <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
                        <form onSubmit={handlePublish} class="space-y-3">
                            <input 
                                type="text" 
                                value={postTag} 
                                onChange={(e) => setPostTag(e.target.value)} 
                                placeholder={t.tagPlaceholder} 
                                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500" 
                            />
                            <textarea 
                                value={postText} 
                                onChange={(e) => setPostText(e.target.value)} 
                                rows="3" 
                                placeholder={t.postPlaceholder} 
                                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500"
                            ></textarea>
                            <button type="submit" disabled={isProcessing} class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-lg transition text-sm">
                                {isProcessing ? "Przetwarzanie..." : t.publish}
                            </button>
                        </form>
                    </div>

                    <!-- STRUMIEŃ WPISÓW -->
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-slate-200">{t.feedTitle}</h2>
                        {posts.map(post => (
                            <div key={post.id} class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                                <div class="flex justify-between items-center text-xs text-slate-400">
                                    <span class="font-semibold text-indigo-400">{post.name} ({post.author})</span>
                                    <span class="bg-slate-800 px-2 py-0.5 rounded text-slate-300">#{post.tag}</span>
                                </div>
                                <p class="text-sm text-slate-100">{post.text}</p>
                            </div>
                        ))}
                    </div>

                    <!-- MODAL DOKUPOWANIA TOKENÓW -->
                    {showBuyModal && (
                        <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full space-y-4">
                                <h3 class="text-lg font-bold text-indigo-400">{t.buyModalTitle}</h3>
                                <p class="text-xs text-slate-400">{t.buyModalDesc}</p>
                                <input 
                                    type="number" 
                                    value={buyAmount} 
                                    onChange={(e) => setBuyAmount(e.target.value)} 
                                    class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white" 
                                />
                                <div class="flex gap-2">
                                    <button onClick={handleBuyTokens} class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-bold py-2 text-sm rounded-lg">
                                        {t.buyAction}
                                    </button>
                                    <button onClick={() => setShowBuyModal(false)} class="bg-slate-800 hover:bg-slate-700 font-bold py-2 px-4 text-sm rounded-lg">
                                        {t.close}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <!-- POWIADOMIENIA TOAST -->
                    {toast && (
                        <div class={`fixed bottom-4 right-4 px-4 py-2.5 rounded-lg font-semibold text-xs text-white shadow-lg ${toast.type === 'error' ? 'bg-red-600' : 'bg-indigo-600'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
