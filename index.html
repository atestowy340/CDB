        function App() {
            const [lang, setLang] = useState('pl');
            const [wallet, setWallet] = useState(null);
            const [nickname, setNickname] = useState('');
            const [newTagInput, setNewTagInput] = useState('');
            const [postText, setPostText] = useState('');
            const [postTag, setPostTag] = useState('');
            const [searchFilter, setSearchFilter] = useState('');
            const [showRules, setShowRules] = useState(false);
            const [showChat, setShowChat] = useState(false);
            const [showBuyModal, setShowBuyModal] = useState(false);
            const [buyAmount, setBuyAmount] = useState('10');
            const [chatMode, setChatMode] = useState('offchain');
            const [chatRecipient, setChatRecipient] = useState('');
            const [chatMessage, setChatMessage] = useState('');
            const [chatHistory, setChatHistory] = useState([]);
            const [inspectTagInfo, setInspectTagInfo] = useState(null);
            const [toast, setToast] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [posts, setPosts] = useState([]);
            const [topComment, setTopComment] = useState(null);

            // Stany dla darmowego limitu i tokena $SSOC
            const [usedMessagesToday, setUsedMessagesToday] = useState(0);
            const [dailyLimit, setDailyLimit] = useState(150);
            const [ssocBalance, setSsocBalance] = useState("0");

            const t = translations[lang] || translations.pl;

            const showNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const loadUserData = async (userAddr) => {
                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const board = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    const token = new ethers.Contract(TOKEN_ADDRESS, TOKEN_ABI, provider);

                    const currentDay = Math.floor(Date.now() / 1000 / 86400);
                    const used = await board.dailyMessageCount(userAddr, currentDay);
                    const limit = await board.dailyFreeLimit();
                    const bal = await token.balanceOf(userAddr);

                    setUsedMessagesToday(used.toNumber());
                    setDailyLimit(limit.toNumber());
                    setSsocBalance(ethers.utils.formatUnits(bal, 18));
                } catch (err) {
                    console.error("Błąd pobierania danych użytkownika:", err);
                }
            };

            const loadPostsFromBlockchain = async () => {
                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    
                    const count = await contract.commentsCount();
                    const loadedPosts = [];

                    for (let i = 1; i <= count.toNumber(); i++) {
                        const c = await contract.comments(i);
                        let authorNick = "";
                        try {
                            authorNick = await contract.nicknames(c.author);
                        } catch (e) {}

                        loadedPosts.push({
                            id: c.id.toNumber(),
                            author: c.author.slice(0,6) + '...' + c.author.slice(-4),
                            fullAuthor: c.author,
                            name: authorNick || 'Anonim',
                            text: c.content,
                            tag: c.tag || 'DEFAULT',
                            votes: c.votes.toNumber()
                        });
                    }

                    setPosts(loadedPosts.reverse());

                    try {
                        const currentDay = Math.floor(Date.now() / 1000 / 86400);
                        const topCommentId = await contract.topCommentPerDay(currentDay);
                        if (topCommentId && topCommentId.toNumber() > 0) {
                            const found = loadedPosts.find(p => p.id === topCommentId.toNumber());
                            setTopComment(found || null);
                        } else {
                            setTopComment(null);
                        }
                    } catch (e) {}

                } catch (err) {
                    console.error("Błąd pobierania postów:", err);
                }
            };

            const inspectTag = async (tagName) => {
                const clean = tagName.trim().replace('#', '');
                if (!clean) {
                    setInspectTagInfo(null);
                    return;
                }

                if (clean.toUpperCase() === 'DEFAULT') {
                    setInspectTagInfo({
                        name: 'DEFAULT',
                        owner: 'System / Public',
                        usesCount: '∞',
                        currentPrice: 'Free',
                        isOwned: false,
                        canBuy: false,
                        isSystemTag: true
                    });
                    return;
                }

                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    const tagData = await contract.tags(clean);

                    if (tagData && tagData.name) {
                        const uses = tagData.usesCount.toNumber();
                        const owned = tagData.isOwned;

                        const canBuy = (!owned && uses >= 50) || (owned && uses >= 100);

                        setInspectTagInfo({
                            name: tagData.name,
                            owner: tagData.owner,
                            usesCount: uses,
                            currentPrice: ethers.utils.formatEther(tagData.currentPrice),
                            isOwned: owned,
                            canBuy: canBuy,
                            isSystemTag: false
                        });
                    } else {
                        setInspectTagInfo({ name: clean, notExists: true });
                    }
                } catch (err) {
                    setInspectTagInfo(null);
                }
            };

            useEffect(() => {
                loadPostsFromBlockchain();
            }, []);

            useEffect(() => {
                if (searchFilter) {
                    inspectTag(searchFilter);
                } else {
                    setInspectTagInfo(null);
                }
            }, [searchFilter]);

            const connectWallet = async () => {
                if (window.ethereum) {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        setWallet(accounts[0]);
                        showNotification("Portfel połączony!");
                        await loadUserData(accounts[0]);
                    } catch (err) {
                        showNotification("Błąd połączenia z portfelem", "error");
                    }
                } else {
                    alert("Zainstaluj MetaMask!");
                }
            };

            const handleBuyoutTag = async (tagName, priceInEth) => {
                if (tagName.toUpperCase() === 'DEFAULT') {
                    showNotification("Tag DEFAULT jest zawsze darmowy i publiczny!", "error");
                    return;
                }
                if (!window.ethereum || !wallet) {
                    showNotification("Połącz najpierw portfel!", "error");
                    connectWallet();
                    return;
                }
                try {
                    setIsProcessing(true);
                    showNotification("Zatwierdzanie wykupu w portfelu...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const tx = await contract.buyOrSnipeTag(tagName, {
                        value: ethers.utils.parseEther(priceInEth),
                        gasLimit: 300000
                    });

                    await tx.wait();
                    showNotification(`Tag #${tagName} został przejęty!`, "success");
                    inspectTag(tagName);
                } catch (err) {
                    console.error(err);
                    showNotification("Transakcja wykupu odrzucona", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleSendChatMessage = async () => {
                if (!chatRecipient || !chatMessage) {
                    showNotification("Wpisz adres odbiorcy oraz treść", "error");
                    return;
                }

                if (chatMode === 'offchain') {
                    const newMsg = {
                        sender: wallet ? wallet.slice(0,6) + '...' : 'Ja',
                        recipient: chatRecipient.slice(0,6) + '...',
                        text: chatMessage,
                        time: new Date
