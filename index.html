<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoDiscussionBoard (CDB)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel dla JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Ethers.js v5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONTRACT_ADDRESS = "0x53289fc98F9bBa2cbbae20a69a3A1178FBF62583";
        
        const CONTRACT_ABI = [
            "function zaglosuj(uint256 _komentarzId) public",
            "function dodajKomentarz(string memory _tresc, string memory _tag) public payable",
            "function setNickname(string memory _nickname) public payable"
        ];

        const translations = {
            pl: {
                brand: "CryptoDiscussionBoard",
                tagline: "Zdecentralizowana tablica społecznościowa Web3",
                connectWallet: "Połącz Portfel",
                setNickname: "Ustaw swój nick (Opcjonalnie)",
                nicknamePlaceholder: "Wpisz unikalny nick...",
                saveNickname: "Zapisz Nick",
                freeNotice: "Nick jest opcjonalny. Pierwsza zmiana darmowa.",
                feedTitle: "Dyskusje Społeczności",
                postPlaceholder: "O czym giełda szumi dzisiaj?",
                tagPlaceholder: "Tag (Opcjonalnie, np. #bitcoin)",
                publish: "Opublikuj wpis",
                filterPlaceholder: "🔍 Szukaj po tagu (#) lub użytkowniku...",
                clearFilter: "Wyczyść filtr",
                rulesBtn: "ℹ️ Zasady i Etyka",
                rulesTitle: "Zasady i Funkcjonowanie CDB",
                rulesText1: "Platforma działa w 100% w oparciu o sieć Base L2 oraz smart kontrakty.",
                rulesText2: "Możesz dodawać wpisy anonimowo lub z własnym nickiem i tagiem.",
                ethicsTitle: "🛡️ Etyka i Moderacja",
                ethicsText: "Stanowczo sprzeciwiamy się mowie nienawiści, oszustwom i spamowi.",
                close: "Zamknij"
            },
            en: {
                brand: "CryptoDiscussionBoard",
                tagline: "Decentralized Web3 Community Board",
                connectWallet: "Connect Wallet",
                setNickname: "Set Your Nickname (Optional)",
                nicknamePlaceholder: "Enter unique nickname...",
                saveNickname: "Save Nickname",
                freeNotice: "Nickname is optional. First change is free.",
                feedTitle: "Community Discussions",
                postPlaceholder: "What's happening in crypto today?",
                tagPlaceholder: "Tag (Optional, e.g. #bitcoin)",
                publish: "Publish Post",
                filterPlaceholder: "🔍 Filter by tag (#) or user...",
                clearFilter: "Clear filter",
                rulesBtn: "ℹ️ Rules & Ethics",
                rulesTitle: "CDB Rules & Features",
                rulesText1: "The platform runs 100% on Base L2 network.",
                rulesText2: "You can post anonymously or with a custom nickname and tag.",
                ethicsTitle: "🛡️ Ethics & Moderation",
                ethicsText: "We strictly oppose hate speech, scams, and spam.",
                close: "Close"
            },
            de: {
                brand: "CryptoDiscussionBoard",
                tagline: "Dezentrales Web3-Community-Board",
                connectWallet: "Wallet verbinden",
                setNickname: "Nickname festlegen (Optional)",
                nicknamePlaceholder: "Einzigartigen Nickname eingeben...",
                saveNickname: "Nickname speichern",
                freeNotice: "Nickname ist optional.",
                feedTitle: "Community-Diskussionen",
                postPlaceholder: "Was passiert heute im Krypto-Markt?",
                tagPlaceholder: "Tag (Optional)",
                publish: "Beitrag veröffentlichen",
                filterPlaceholder: "🔍 Filtern nach Tag oder Benutzer...",
                clearFilter: "Filter löschen",
                rulesBtn: "ℹ️ Regeln & Ethik",
                rulesTitle: "CDB Regeln & Funktionen",
                rulesText1: "Die Plattform läuft zu 100% über das Base L2-Netzwerk.",
                rulesText2: "Sie können anonym oder mit einem Nickname posten.",
                ethicsTitle: "🛡️ Ethik & Moderation",
                ethicsText: "Wir lehnen Hassrede und Spam strikt ab.",
                close: "Schließen"
            }
        };

        function App() {
            const [lang, setLang] = useState('pl');
            const [wallet, setWallet] = useState(null);
            const [nickname, setNickname] = useState('');
            const [savedNick, setSavedNick] = useState('');
            const [postText, setPostText] = useState('');
            const [postTag, setPostTag] = useState('');
            const [searchFilter, setSearchFilter] = useState('');
            const [showRules, setShowRules] = useState(false);
            const [toast, setToast] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);

            const [posts, setPosts] = useState([
                { id: 0, author: "0x7a69...e55", name: "SatoshiFan", text: "Witaj na zdecentralizowanej tablicy CDB!", tag: "ogolny", votes: 3 }
            ]);

            const t = translations[lang];

            const showNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const connectWallet = async () => {
                if (window.ethereum) {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        setWallet(accounts[0]);
                        showNotification("Połączono z portfelem!");
                    } catch (err) {
                        showNotification("Błąd połączenia z portfelem!", "error");
                    }
                } else {
                    showNotification("Zainstaluj wtyczkę MetaMask!", "error");
                }
            };

            const handleVote = async (postId) => {
                if (!window.ethereum || !wallet) {
                    showNotification("Połącz najpierw portfel!", "error");
                    connectWallet();
                    return;
                }

                try {
                    setIsProcessing(true);
                    showNotification("Otwieranie MetaMask dla głosowania...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const tx = await contract.zaglosuj(postId, { gasLimit: 150000 });
                    showNotification("Transakcja w toku...", "info");
                    
                    await tx.wait();
                    setPosts(posts.map(item => item.id === postId ? {...item, votes: item.votes + 1} : item));
                    showNotification("Oddano głos!", "success");
                } catch (err) {
                    console.error(err);
                    showNotification("Głosowanie anulowane lub niedozwolone", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleSaveNickname = async () => {
                if (!nickname.trim()) {
                    showNotification("Wpisz poprawny nick!", "error");
                    return;
                }
                if (!window.ethereum || !wallet) {
                    showNotification("Połącz najpierw portfel!", "error");
                    connectWallet();
                    return;
                }

                try {
                    setIsProcessing(true);
                    showNotification("Zatwierdź nick w MetaMask...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const tx = await contract.setNickname(nickname, { gasLimit: 200000 });
                    await tx.wait();

                    setSavedNick(nickname);
                    showNotification(`Nick '${nickname}' został zapisany!`, "success");
                } catch (err) {
                    console.error(err);
                    showNotification("Błąd podczas zapisywania nicku", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            // BEZPIECZNE PUBLIKOWANIE WPISU (Działa zawsze)
            const handlePublish = async (e) => {
                e.preventDefault();
                if (!postText.trim()) {
                    showNotification("Wpis nie może być pusty!", "error");
                    return;
                }

                if (!window.ethereum || !wallet) {
                    showNotification("Połącz portfel, aby opublikować on-chain!", "error");
                    connectWallet();
                    return;
                }

                const cleanedTag = postTag.replace('#', '').trim() || 'ogolny';
                const userDisplayName = savedNick || (nickname.trim() ? nickname : wallet.slice(0,6) + '...' + wallet.slice(-4));

                try {
                    setIsProcessing(true);
                    showNotification("Potwierdź publikację w portfelu...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    let tx;
                    try {
                        // Próba bez opłat (darmowy wpis / darmowy tag)
                        tx = await contract.dodajKomentarz(postText, cleanedTag, { gasLimit: 300000 });
                    } catch (feeError) {
                        // Jeśli kontrakt wymaga minimalnej opłaty za tag (~1 cent = 0.000004 ETH)
                        tx = await contract.dodajKomentarz(postText, cleanedTag, { 
                            value: ethers.utils.parseEther("0.000004"),
                            gasLimit: 300000 
                        });
                    }

                    showNotification("Transakcja w sieci Base...", "info");
                    await tx.wait();

                    const newPost = {
                        id: posts.length,
                        author: wallet.slice(0,6) + '...' + wallet.slice(-4),
                        name: userDisplayName,
                        text: postText,
                        tag: cleanedTag,
                        votes: 0
                    };

                    setPosts([newPost, ...posts]);
                    setPostText('');
                    setPostTag('');
                    showNotification("Wpis pomyślnie dodany do sieci!", "success");
                } catch (err) {
                    console.error("Szczegóły błędu:", err);
                    showNotification("Transakcja odrzucona lub anulowana", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const filteredPosts = posts.filter(p => {
                if (!searchFilter) return true;
                const filter = searchFilter.toLowerCase().replace('#', '');
                return p.tag.toLowerCase().includes(filter) || 
                       p.name.toLowerCase().includes(filter) || 
                       p.author.toLowerCase().includes(filter);
            });

            return (
                <div className="max-w-2xl mx-auto p-4 md:p-6 space-y-6">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-xl text-sm font-medium border flex items-center gap-2 transition-all duration-300 ${
                            toast.type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
                            toast.type === 'info' ? 'bg-blue-950/90 border-blue-800 text-blue-200' :
                            'bg-emerald-950/90 border-emerald-800 text-emerald-200'
                        }`}>
                            <span>{toast.type === 'error' ? '❌' : toast.type === 'info' ? '⏳' : '✅'}</span>
                            {toast.msg}
                        </div>
                    )}

                    <header className="flex justify-between items-center border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                                ⛓️ {t.brand}
                            </h1>
                            <p className="text-xs text-slate-400">{t.tagline}</p>
                        </div>

                        <div className="flex items-center gap-2">
                            <div className="flex bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs">
                                <button onClick={() => setLang('pl')} className={`px-2 py-1 rounded-lg ${lang === 'pl' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>PL</button>
                                <button onClick={() => setLang('en')} className={`px-2 py-1 rounded-lg ${lang === 'en' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>EN</button>
                                <button onClick={() => setLang('de')} className={`px-2 py-1 rounded-lg ${lang === 'de' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>DE</button>
                            </div>

                            <button 
                                onClick={connectWallet}
                                className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-semibold transition"
                            >
                                {wallet ? wallet.slice(0,6) + '...' : t.connectWallet}
                            </button>
                        </div>
                    </header>

                    <div className="flex justify-end">
                        <button onClick={() => setShowRules(true)} className="text-xs text-slate-400 hover:text-slate-200 underline transition">
                            {t.rulesBtn}
                        </button>
                    </div>

                    {/* SEKCJA USTAWIENIA NICKU (OPCJONALNA) */}
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
                        <h2 className="text-sm font-semibold text-slate-200">{t.setNickname}</h2>
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={nickname}
                                onChange={(e) => setNickname(e.target.value)}
                                placeholder={t.nicknamePlaceholder} 
                                className="bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm flex-1 focus:outline-none focus:border-blue-500 text-slate-200"
                            />
                            <button 
                                onClick={handleSaveNickname}
                                disabled={isProcessing}
                                className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm transition font-medium disabled:opacity-50"
                            >
                                {isProcessing ? "Przetwarzanie..." : t.saveNickname}
                            </button>
                        </div>
                        <p className="text-[11px] text-slate-500">{t.freeNotice}</p>
                    </div>

                    {/* FORMULARZ DODAWANIA WPISU */}
                    <form onSubmit={handlePublish} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <textarea 
                            rows="3"
                            value={postText}
                            onChange={(e) => setPostText(e.target.value)}
                            placeholder={t.postPlaceholder}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-200"
                        />
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input 
                                type="text" 
                                value={postTag}
                                onChange={(e) => setPostTag(e.target.value)}
                                placeholder={t.tagPlaceholder} 
                                className="bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm flex-1 focus:outline-none focus:border-blue-500 text-slate-200"
                            />
                            <button type="submit" disabled={isProcessing} className="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2 rounded-xl text-sm transition disabled:opacity-50">
                                {isProcessing ? "Wysyłanie..." : t.publish}
                            </button>
                        </div>
                    </form>

                    {/* PASEK FILTRÓW */}
                    <div className="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-2">
                        <input 
                            type="text" 
                            value={searchFilter}
                            onChange={(e) => setSearchFilter(e.target.value)}
                            placeholder={t.filterPlaceholder}
                            className="bg-transparent text-sm text-slate-200 focus:outline-none w-full"
                        />
                        {searchFilter && (
                            <button onClick={() => setSearchFilter('')} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-1 rounded-lg transition">
                                {t.clearFilter}
                            </button>
                        )}
                    </div>

                    {/* LISTA WPISÓW */}
                    <div className="space-y-4">
                        <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">{t.feedTitle}</h2>
                        {filteredPosts.length === 0 ? (
                            <p className="text-center text-xs text-slate-500 py-6">Brak wpisów pasujących do filtra.</p>
                        ) : (
                            filteredPosts.map(p => (
                                <div key={p.id} className="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-2">
                                    <div className="flex justify-between items-center text-xs text-slate-400">
                                        <button onClick={() => setSearchFilter(p.name)} className="font-bold text-slate-300 hover:text-blue-400 text-left transition">
                                            {p.name} <span className="text-[10px] text-slate-500">({p.author})</span>
                                        </button>
                                        <button onClick={() => setSearchFilter(p.tag)} className="bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg text-blue-400 font-medium transition">
                                            #{p.tag}
                                        </button>
                                    </div>
                                    <p className="text-sm text-slate-200">{p.text}</p>
                                    <div className="flex justify-end pt-1">
                                        <button 
                                            onClick={() => handleVote(p.id)}
                                            disabled={isProcessing}
                                            className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-xl text-slate-300 transition disabled:opacity-50"
                                        >
                                            👍 Podbij ({p.votes})
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* MODAL Z ZASADAMI */}
                    {showRules && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-lg w-full space-y-4 shadow-2xl">
                                <h3 className="font-bold text-lg text-slate-100">{t.rulesTitle}</h3>
                                <div className="space-y-2 text-sm text-slate-300">
                                    <p>{t.rulesText1}</p>
                                    <p>{t.rulesText2}</p>
                                    <div className="bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl space-y-1 mt-4">
                                        <h4 className="font-semibold text-rose-400 text-xs uppercase">{t.ethicsTitle}</h4>
                                        <p className="text-xs text-slate-300">{t.ethicsText}</p>
                                    </div>
                                </div>
                                <button onClick={() => setShowRules(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-xl text-sm font-medium transition mt-4">
                                    {t.close}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
