        const CONTRACT_ADDRESS = "0x53289fc98F9bBa2cbbae20a69a3A1178FBF62583";

        const CONTRACT_ABI = [
            "function voteComment(uint256 _commentId) external",

        function App() {
            const [lang, setLang] = useState('en');
            const [wallet, setWallet] = useState(null);
            const [nickname, setNickname] = useState('');
            const [newTagInput, setNewTagInput] = useState('');
            const [postText, setPostText] = useState('');
            const [postTag, setPostTag] = useState('');
            const [searchFilter, setSearchFilter] = useState('');
            const [showRules, setShowRules] = useState(false);
            const [showChat, setShowChat] = useState(false);
            const [chatMode, setChatMode] = useState('offchain');
            const [chatRecipient, setChatRecipient] = useState('');
            const [chatMessage, setChatMessage] = useState('');
            const [chatHistory, setChatHistory] = useState([]);
            const [inspectTagInfo, setInspectTagInfo] = useState(null);
            const [toast, setToast] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [posts, setPosts] = useState([]);
            const [topComment, setTopComment] = useState(null);

            const t = translations[lang] || translations.en;

            const showNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const loadPostsFromBlockchain = async () => {
                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    
                    const count = await contract.commentsCount();
                    const loadedPosts = [];

                    for (let i = 1; i <= count.toNumber(); i++) {
                        const c = await contract.comments(i);
                        let authorNick = "";
                        try {
                            authorNick = await contract.nicknames(c.author);
                        } catch (e) {}

                        loadedPosts.push({
                            id: c.id.toNumber(),
                            author: c.author.slice(0,6) + '...' + c.author.slice(-4),
                            fullAuthor: c.author,
                            name: authorNick || 'Anonim',
                            text: c.content,
                            tag: c.tag || 'DEFAULT',
                            votes: c.votes.toNumber()
                        });
                    }

                    setPosts(loadedPosts.reverse());

                    // ODCZYT KOMENTARZA DNIA (Top Comment of the Day)
                    try {
                        const currentDay = Math.floor(Date.now() / 1000 / 86400);
                        const topCommentId = await contract.topCommentPerDay(currentDay);
                        if (topCommentId && topCommentId.toNumber() > 0) {
                            const found = loadedPosts.find(p => p.id === topCommentId.toNumber());
                            setTopComment(found || null);
                        } else {
                            setTopComment(null);
                        }
                    } catch (e) {
                        console.error("Top comment load error", e);
                    }

                } catch (err) {
                    console.error("Error loading posts:", err);
                }
            };

            const inspectTag = async (tagName) => {
                const clean = tagName.trim().replace('#', '');
                if (!clean) {
                    setInspectTagInfo(null);
                    return;
                }

                if (clean.toUpperCase() === 'DEFAULT') {
                    setInspectTagInfo({
                        name: 'DEFAULT',
                        owner: 'System / Public',
                        usesCount: '∞',
                        currentPrice: 'Free',
                        isOwned: false,
                        canSnipe: false,
                        isSystemTag: true
                    });
                    return;
                }

                try {
                    const provider = new ethers.providers.JsonRpcProvider(BASE_SEPOLIA_RPC);
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
                    const tagData = await contract.tags(clean);

                    if (tagData && tagData.name) {
                        setInspectTagInfo({
                            name: tagData.name,
                            owner: tagData.owner,
                            usesCount: tagData.usesCount.toNumber(),
                            currentPrice: ethers.utils.formatEther(tagData.currentPrice),
                            isOwned: tagData.isOwned,
                            canSnipe: tagData.usesCount.toNumber() >= 500,
                            isSystemTag: false
                        });
                    } else {
                        setInspectTagInfo({ name: clean, notExists: true });
                    }
                } catch (err) {
                    setInspectTagInfo(null);
                }
            };

            useEffect(() => {
                loadPostsFromBlockchain();
            }, []);

            useEffect(() => {
                if (searchFilter) {
                    inspectTag(searchFilter);
                } else {
                    setInspectTagInfo(null);
                }
            }, [searchFilter]);

            const connectWallet = async () => {
                if (window.ethereum) {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        setWallet(accounts[0]);
                        showNotification("Wallet connected!");
                    } catch (err) {
                        showNotification("Connection error", "error");
                    }
                } else {
                    alert("Please install MetaMask!");
                }
            };

            const handleBuyoutTag = async (tagName, priceInEth) => {
                if (tagName.toUpperCase() === 'DEFAULT') {
                    showNotification("Tag DEFAULT jest zawsze darmowy i publiczny!", "error");
                    return;
                }
                if (!window.ethereum || !wallet) {
                    showNotification("Connect wallet first!", "error");
                    connectWallet();
                    return;
                }
                try {
                    setIsProcessing(true);
                    showNotification("Confirming tag buyout in wallet...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const tx = await contract.buyOrSnipeTag(tagName, {
                        value: ethers.utils.parseEther(priceInEth),
                        gasLimit: 300000
                    });

                    await tx.wait();
                    showNotification(`Tag #${tagName} is now owned by you!`, "success");
                    inspectTag(tagName);
                } catch (err) {
                    console.error(err);
                    showNotification("Buyout transaction reverted", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleSendChatMessage = async () => {
                if (!chatRecipient || !chatMessage) {
                    showNotification("Fill recipient address and message", "error");
                    return;
                }

                if (chatMode === 'offchain') {
                    const newMsg = {
                        sender: wallet ? wallet.slice(0,6) + '...' : 'Me',
                        recipient: chatRecipient.slice(0,6) + '...',
                        text: chatMessage,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        mode: 'Off-Chain'
                    };
                    setChatHistory([...chatHistory, newMsg]);
                    setChatMessage('');
                    showNotification("Message sent via Off-Chain network!", "success");
                } else {
                    if (!window.ethereum || !wallet) {
                        showNotification("Connect wallet first!", "error");
                        connectWallet();
                        return;
                    }
                    try {
                        setIsProcessing(true);
                        showNotification("Sending On-Chain message transaction...", "info");

                        const provider = new ethers.providers.Web3Provider(window.ethereum);
                        const signer = provider.getSigner();
                        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                        const tx = await contract.addComment(`[DM to ${chatRecipient}]: ${chatMessage}`, "", { gasLimit: 300000 });
                        await tx.wait();

                        setChatMessage('');
                        showNotification("On-Chain DM recorded permanently!", "success");
                        loadPostsFromBlockchain();
                    } catch (err) {
                        showNotification("Failed to send On-Chain DM", "error");
                    } finally {
                        setIsProcessing(false);
                    }
                }
            };

            const handleVote = async (postId) => {
                if (!window.ethereum || !wallet) {
                    showNotification("Connect wallet first!", "error");
                    connectWallet();
                    return;
                }

                try {
                    setIsProcessing(true);
                    showNotification("Confirm vote in wallet...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const tx = await contract.voteComment(postId, { gasLimit: 150000 });
                    await tx.wait();

                    showNotification("Vote recorded on-chain!", "success");
                    loadPostsFromBlockchain();
                } catch (err) {
                    console.error(err);
                    showNotification("Voting failed or already voted today", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleSaveNickname = async () => {
                if (!nickname.trim()) {
                    showNotification("Enter valid nickname", "error");
                    return;
                }
                if (!window.ethereum || !wallet) {
                    showNotification("Connect wallet first!", "error");
                    connectWallet();
                    return;
                }

                try {
                    setIsProcessing(true);
                    showNotification("Checking fee requirements...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const changesCount = await contract.nicknameChangesCount(wallet);
                    let requiredFee = ethers.BigNumber.from(0);

                    if (changesCount.gt(0)) {
                        const baseFee = ethers.utils.parseEther("0.00005");
                        requiredFee = baseFee.mul(changesCount);
                    }

                    const tx = await contract.setNickname(nickname, { 
                        value: requiredFee,
                        gasLimit: 250000 
                    });

                    showNotification("Confirming on Base network...", "info");
                    await tx.wait();

                    showNotification(`Nickname '${nickname}' saved!`, "success");
                } catch (err) {
                    console.error("Nickname error:", err);
                    showNotification("Error saving nickname or insufficient fee", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleRegisterTag = async () => {
                if (!newTagInput.trim()) {
                    showNotification("Enter tag name", "error");
                    return;
                }
                if (newTagInput.trim().toUpperCase() === 'DEFAULT') {
                    showNotification("DEFAULT is a reserved system tag!", "error");
                    return;
                }
                if (!window.ethereum || !wallet) {
                    showNotification("Connect wallet first!", "error");
                    connectWallet();
                    return;
                }

                const cleanTag = newTagInput.trim().replace('#', '');

                try {
                    setIsProcessing(true);
                    showNotification("Confirming tag registration...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    const tx = await contract.registerCustomTag(cleanTag, { gasLimit: 200000 });
                    await tx.wait();

                    setNewTagInput('');
                    showNotification(`Tag #${cleanTag} registered!`, "success");
                } catch (err) {
                    console.error(err);
                    showNotification("Tag registration error (limit reached or exists)", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handlePublish = async (e) => {
                e.preventDefault();
                if (!postText.trim()) {
                    showNotification("Content cannot be empty", "error");
                    return;
                }

                if (!window.ethereum || !wallet) {
                    showNotification("Connect wallet first!", "error");
                    connectWallet();
                    return;
                }

                const tagToSend = postTag.trim() ? postTag.trim().replace('#', '') : "";

                try {
                    setIsProcessing(true);
                    showNotification("Publishing to Base network...", "info");

                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const signer = provider.getSigner();
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    let requiredValue = ethers.BigNumber.from(0);

                    if (tagToSend && tagToSend.toUpperCase() !== 'DEFAULT') {
                        try {
                            const tagInfo = await contract.tags(tagToSend);
                            if (tagInfo && tagInfo.isOwned) {
                                requiredValue = await contract.editableUseFee();
                            }
                        } catch (e) {}
                    }

                    const tx = await contract.addComment(postText, tagToSend, { 
                        value: requiredValue,
                        gasLimit: 350000 
                    });
                    
                    await tx.wait();

                    setPostText('');
                    setPostTag('');
                    showNotification("Post published on-chain!", "success");
                    loadPostsFromBlockchain();
                } catch (err) {
                    console.error("Publish error:", err);
                    showNotification("Transaction reverted (check if tag exists)", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const filteredPosts = posts.filter(p => {
                if (!searchFilter) return true;
                const filter = searchFilter.toLowerCase().replace('#', '');
                return p.tag.toLowerCase().includes(filter) || 
                       p.name.toLowerCase().includes(filter) || 
                       p.author.toLowerCase().includes(filter);
            });

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-6">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium border flex items-center gap-2 transition-all duration-300 ${
                            toast.type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
                            toast.type === 'info' ? 'bg-blue-950/90 border-blue-800 text-blue-200' :
                            'bg-emerald-950/90 border-emerald-800 text-emerald-200'
                        }`}>
                            <span>{toast.type === 'error' ? '❌' : toast.type === 'info' ? '⏳' : '✅'}</span>
                            {toast.msg}
                        </div>
                    )}

                    {/* NAGŁÓWEK */}
                    <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">
                                ⛓️ {t.brand}
                            </h1>
                            <p className="text-xs text-slate-400 mt-0.5">{t.tagline}</p>
                        </div>

                        <div className="flex items-center gap-2.5 self-end sm:self-auto">
                            <button onClick={() => setShowChat(!showChat)} className="bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1">
                                💬 {t.chatTitle}
                            </button>

                            <button onClick={() => setShowRules(true)} className="text-xs text-slate-400 hover:text-slate-200 underline transition mr-1">
                                {t.rulesBtn}
                            </button>

                            <div className="flex bg-slate-900 border border-slate-800 rounded-xl p-1 text-xs">
                                <button onClick={() => setLang('en')} className={`px-2.5 py-1 rounded-lg font-medium transition ${lang === 'en' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>EN</button>
                                <button onClick={() => setLang('de')} className={`px-2.5 py-1 rounded-lg font-medium transition ${lang === 'de' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>DE</button>
                                <button onClick={() => setLang('pl')} className={`px-2.5 py-1 rounded-lg font-medium transition ${lang === 'pl' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>PL</button>
                            </div>

                            <button 
                                onClick={connectWallet}
                                className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-blue-900/30 transition"
                            >
                                {wallet ? wallet.slice(0,6) + '...' + wallet.slice(-4) : t.connectWallet}
                            </button>
                        </div>
                    </header>

                    {/* SEKACJA: KOMENTARZ DNIA (TOP COMMENT OF THE DAY) */}
                    <section className="bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-yellow-500/10 border border-amber-500/30 p-4 rounded-2xl shadow-lg relative overflow-hidden">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                                {t.topCommentTitle}
                            </h3>
                            <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-medium">UTC Today</span>
                        </div>
                        {topComment ? (
                            <div className="space-y-1.5">
                                <div className="flex justify-between items-center text-xs text-slate-300">
                                    <span className="font-semibold text-slate-100">{topComment.name} <span className="text-[10px] text-slate-400">({topComment.author})</span></span>
                                    <span className="text-amber-400 font-bold text-xs">👍 {topComment.votes} votes</span>
                                </div>
                                <p className="text-xs text-slate-200 italic bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">
                                    "{topComment.text}"
                                </p>
                            </div>
                        ) : (
                            <p className="text-xs text-slate-400 italic py-1">{t.noTopComment}</p>
                        )}
                    </section>

                    {/* MODUŁ CHATU BEZPOŚREDNIEGO */}
                    {showChat && (
                        <section className="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                <h3 className="text-xs font-semibold text-slate-200 flex items-center gap-1.5">
                                    💬 {t.chatTitle}
                                </h3>
                                <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px]">
                                    <button onClick={() => setChatMode('offchain')} className={`px-2 py-0.5 rounded-lg ${chatMode === 'offchain' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>{t.offchainChat}</button>
                                    <button onClick={() => setChatMode('onchain')} className={`px-2 py-0.5 rounded-lg ${chatMode === 'onchain' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>{t.onchainChat}</button>
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-2">
                                <input 
                                    type="text" 
                                    value={chatRecipient}
                                    onChange={(e) => setChatRecipient(e.target.value)}
                                    placeholder={t.recipientPlaceholder} 
                                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs flex-1 text-slate-200 focus:outline-none focus:border-blue-500"
                                />
                                <input 
                                    type="text" 
                                    value={chatMessage}
                                    onChange={(e) => setChatMessage(e.target.value)}
                                    placeholder={t.msgPlaceholder} 
                                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs flex-1 text-slate-200 focus:outline-none focus:border-blue-500"
                                />
                                <button onClick={handleSendChatMessage} disabled={isProcessing} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-xl text-xs font-medium transition disabled:opacity-50">
                                    {t.sendMsg}
                                </button>
                            </div>

                            {chatHistory.length > 0 && (
                                <div className="max-h-32 overflow-y-auto space-y-1.5 pt-2 border-t border-slate-800/60">
                                    {chatHistory.map((m, idx) => (
                                        <div key={idx} className="text-[11px] bg-slate-950/80 p-2 rounded-xl border border-slate-800/50 flex justify-between">
                                            <span className="text-slate-300"><b>To {m.recipient}:</b> {m.text}</span>
                                            <span className="text-slate-500 text-[10px]">{m.time} ({m.mode})</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </section>
                    )}

                    {/* FORMULARZ PUBLIKACJI POSTU */}
                    <section className="bg-slate-900/90 border border-slate-800/80 p-4 rounded-2xl shadow-xl space-y-3">
                        <textarea 
                            rows="3"
                            value={postText}
                            onChange={(e) => setPostText(e.target.value)}
                            placeholder={t.postPlaceholder}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100 placeholder-slate-500 resize-none transition"
                        />
                        <div className="flex flex-col sm:flex-row gap-2.5">
                            <input 
                                type="text" 
                                value={postTag}
                                onChange={(e) => setPostTag(e.target.value)}
                                placeholder={t.tagPlaceholder} 
                                className="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs flex-1 focus:outline-none focus:border-blue-500 text-slate-100 placeholder-slate-500 transition"
                            />
                            <button 
                                type="submit" 
                                onClick={handlePublish}
                                disabled={isProcessing} 
                                className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-900/20 disabled:opacity-50"
                            >
                                {isProcessing ? "..." : t.publish}
                            </button>
                        </div>
                    </section>

                    {/* POZIOMY PANEL KONTROLNY */}
                    <section className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div className="bg-slate-900/80 border border-slate-800/80 p-3 rounded-2xl flex flex-col justify-between space-y-2">
                            <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{t.setNickname}</span>
                            <div className="flex gap-1.5">
                                <input 
                                    type="text" 
                                    value={nickname}
                                    onChange={(e) => setNickname(e.target.value)}
                                    placeholder={t.nicknamePlaceholder} 
                                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs w-full focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500"
                                />
                                <button 
                                    onClick={handleSaveNickname}
                                    disabled={isProcessing}
                                    className="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shrink-0 disabled:opacity-50"
                                >
                                    {isProcessing ? "..." : t.saveNickname}
                                </button>
                            </div>
                        </div>

                        <div className="bg-slate-900/80 border border-slate-800/80 p-3 rounded-2xl flex flex-col justify-between space-y-2">
                            <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{t.registerTagTitle}</span>
                            <div className="flex gap-1.5">
                                <input 
                                    type="text" 
                                    value={newTagInput}
                                    onChange={(e) => setNewTagInput(e.target.value)}
                                    placeholder={t.tagRegPlaceholder} 
                                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs w-full focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500"
                                />
                                <button 
                                    onClick={handleRegisterTag}
                                    disabled={isProcessing}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shrink-0 disabled:opacity-50"
                                >
                                    {isProcessing ? "..." : t.registerTagBtn}
                                </button>
                            </div>
                        </div>

                        <div className="bg-slate-900/80 border border-slate-800/80 p-3 rounded-2xl flex flex-col justify-between space-y-2">
                            <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Search Filter & Tag Status</span>
                            <div className="flex gap-1.5">
                                <input 
                                    type="text" 
                                    value={searchFilter}
                                    onChange={(e) => setSearchFilter(e.target.value)}
                                    placeholder={t.searchPlaceholder}
                                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs w-full focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500"
                                />
                                {searchFilter && (
                                    <button onClick={() => setSearchFilter('')} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-xl text-xs transition shrink-0">
                                        {t.clearFilter}
                                    </button>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* MODUŁ INSPEKTORA TAGU / WYKUPU */}
                    {inspectTagInfo && (
                        <div className="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-lg space-y-2 text-xs">
                            <div className="flex justify-between items-center">
                                <span className="font-semibold text-slate-200 flex items-center gap-1.5">
                                    🔍 {t.tagStatusTitle} <span className="text-blue-400">#{inspectTagInfo.name}</span>
                                </span>
                                {inspectTagInfo.isSystemTag ? (
                                    <span className="bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/20 font-medium">{t.systemTag}</span>
                                ) : inspectTagInfo.notExists ? (
                                    <span className="bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20 font-medium">{t.unregisteredTag}</span>
                                ) : inspectTagInfo.isOwned ? (
                                    <span className="bg-purple-500/10 text-purple-400 px-2.5 py-1 rounded-lg border border-purple-500/20 font-medium">{t.ownedTag}</span>
                                ) : inspectTagInfo.canSnipe ? (
                                    <span className="bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/20 font-medium">{t.readyForSnipe}</span>
                                ) : (
                                    <span className="bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/20 font-medium">{t.freeOrInUse}</span>
                                )}
                            </div>

                            {!inspectTagInfo.notExists && !inspectTagInfo.isSystemTag && (
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1 text-slate-400">
                                    <div>{t.usesCountLabel} <b className="text-slate-200">{inspectTagInfo.usesCount} / 500</b></div>
                                    <div>{t.buyoutPriceLabel} <b className="text-slate-200">{inspectTagInfo.currentPrice} ETH</b></div>
                                    <div className="col-span-2 text-right">
                                        {(inspectTagInfo.canSnipe || inspectTagInfo.isOwned) && (
                                            <button 
                                                onClick={() => handleBuyoutTag(inspectTagInfo.name, inspectTagInfo.currentPrice)}
                                                disabled={isProcessing}
                                                className="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-semibold px-3 py-1 rounded-xl shadow transition disabled:opacity-50"
                                            >
                                                {inspectTagInfo.canSnipe ? t.snipeTag : t.buyoutTag} ({inspectTagInfo.currentPrice} ETH)
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* STRUMIEŃ WPISÓW */}
                    <main className="space-y-3 pt-2">
                        <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{t.feedTitle}</h2>
                        {filteredPosts.length === 0 ? (
                            <div className="text-center text-xs text-slate-500 py-10 bg-slate-900/30 border border-slate-800/50 rounded-2xl">
                                No posts found on-chain.
                            </div>
                        ) : (
                            filteredPosts.map(p => (
                                <article key={p.id} className="p-4 bg-slate-900/90 border border-slate-800/80 rounded-2xl space-y-2.5 shadow-md hover:border-slate-700 transition">
                                    <div className="flex justify-between items-center text-xs text-slate-400">
                                        <button 
                                            onClick={() => {
                                                setSearchFilter(p.name);
                                                setChatRecipient(p.fullAuthor);
                                                setShowChat(true);
                                            }} 
                                            className="font-semibold text-slate-200 hover:text-blue-400 text-left transition flex items-center gap-1.5"
                                        >
                                            <span>{p.name}</span>
                                            <span className="text-[10px] text-slate-500 font-normal">({p.author})</span>
                                            <span className="text-[10px] text-blue-400 hover:underline ml-1">💬 Chat</span>
                                        </button>
                                        <button onClick={() => setSearchFilter(p.tag)} className="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg text-blue-400 text-[11px] font-medium transition border border-slate-700/50">
                                            #{p.tag}
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-200 leading-relaxed">{p.text}</p>
                                    <div className="flex justify-end pt-1">
                                        <button 
                                            onClick={() => handleVote(p.id)}
                                            disabled={isProcessing}
                                            className="text-[11px] bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-xl text-slate-300 transition disabled:opacity-50 flex items-center gap-1 border border-slate-700/40"
                                        >
                                            👍 ({p.votes})
                                        </button>
                                    </div>
                                </article>
                            ))
                        )}
                    </main>

                    {/* MODAL Z ROZBUDOWANYMI ZASADAMI I MECHANIKĄ (WHITEPAPER) */}
                    {showRules && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-2xl w-full space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
                                <h3 className="font-bold text-lg text-slate-100 border-b border-slate-800 pb-3">{t.rulesTitle}</h3>
                                <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                                    <p className="text-slate-400">{t.rulesIntro}</p>
                                    
                                    <div className="space-y-1 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                                        <h4 className="font-semibold text-blue-400 text-sm">{t.rule1Title}</h4>
                                        <p className="whitespace-pre-line text-slate-300">{t.rule1Text}</p>
                                    </div>

                                    <div className="space-y-1 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                                        <h4 className="font-semibold text-teal-400 text-sm">{t.rule2Title}</h4>
                                        <p className="whitespace-pre-line text-slate-300">{t.rule2Text}</p>
                                    </div>

                                    <div className="space-y-1 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                                        <h4 className="font-semibold text-emerald-400 text-sm">{t.rule3Title}</h4>
                                        <p className="whitespace-pre-line text-slate-300">{t.rule3Text}</p>
                                    </div>

                                    <div className="space-y-1 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                                        <h4 className="font-semibold text-indigo-400 text-sm">{t.rule4Title}</h4>
                                        <p className="whitespace-pre-line text-slate-300">{t.rule4Text}</p>
                                    </div>

                                    <div className="bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl space-y-1">
                                        <h4 className="font-semibold text-rose-400 text-xs uppercase">{t.ethicsTitle}</h4>
                                        <p className="text-xs text-slate-300">{t.ethicsText}</p>
                                    </div>
                                </div>
                                <button onClick={() => setShowRules(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-xs font-medium transition mt-4">
                                    {t.close}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
